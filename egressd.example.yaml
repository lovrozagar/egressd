# Copy to ./egressd.yaml (gitignored) or ~/.config/egressd/config.yaml
#
# Config search order:
#   1. -config flag / EGRESSD_CONFIG env
#   2. ./egressd.yaml
#   3. ~/.config/egressd/config.yaml

listen:
  socks: 127.0.0.1:1080
  http: 127.0.0.1:8080

users:
  # Relative paths are resolved next to the config file.
  # Contains bcrypt hashes only — never commit real users.json.
  file: users.json
